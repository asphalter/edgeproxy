[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:caddy]
command=/usr/local/bin/caddy run --config /data/caddy/Caddyfile --adapter caddyfile
directory=/data/caddy
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rathole]
command=/usr/local/bin/rathole --server /data/rathole/server.toml
directory=/data/rathole
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/rathole.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/rathole.log
stderr_logfile_maxbytes=10MB

[program:oauth2-proxy]
command=/usr/local/bin/oauth2-proxy --config=/data/oauth2-proxy/oauth2-proxy.cfg
directory=/data/oauth2-proxy
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:manager]
command=python3 -m uvicorn app:app --host 0.0.0.0 --port 8000
directory=/app/manager
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
